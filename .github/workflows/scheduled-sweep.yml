name: Scheduled EBB sweep

on:
  schedule:
    - cron: '7 9,13,18,22 * * *'
      timezone: America/Chicago
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger production sweep
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 320 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://ebb-watch.vercel.app/api/cron |
            jq -e 'if .status then {boards: (.status | length)} elif .skipped then {skipped} else error("Unexpected sweep response") end'
